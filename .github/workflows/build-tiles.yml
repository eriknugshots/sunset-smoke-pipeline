name: build-tiles
on:
  schedule:
    - cron: "23 * * * *"      # hourly; run_cycle exits fast unless a new synoptic cycle exists
  workflow_dispatch:
    inputs:
      hours:
        description: "limit forecast hours (testing)"
        required: false
permissions:
  contents: write
concurrency:
  group: build-tiles
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # 8 regions (home + conus + up to 6 plume) x 49 hours: one download pass
    # (~30 min, measured 39 min single-region on 2026-07-27) + ~6 s regrid per
    # region-hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: install wgrib2
        run: |
          # Ubuntu 24.04 has no apt wgrib2 package (verified: first real run, 2026-07-27) —
          # conda-forge is the working path; keep the apt attempt in case future images add it.
          sudo apt-get update -qq
          if sudo apt-get install -y wgrib2 2>/dev/null; then
            echo "wgrib2 from apt"
          else
            echo "apt wgrib2 unavailable; using conda-forge"
            wget -qO mm https://micro.mamba.pm/api/micromamba/linux-64/latest
            tar -xj -f mm bin/micromamba
            ./bin/micromamba create -y -p /tmp/wg -c conda-forge wgrib2
            # GITHUB_PATH only applies to LATER steps; export for this step's verification too
            echo "/tmp/wg/bin" >> "$GITHUB_PATH"
            export PATH="/tmp/wg/bin:$PATH"
          fi
          command -v wgrib2
          wgrib2 -version || true   # some builds exit non-zero on -version; command -v above is the real check
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: build cycle
        env:
          # Without this Python buffers stdout when it is not a TTY, so a run that
          # is cancelled or times out discards ALL its progress output — the
          # 2026-07-27 timeout logged zero forecast hours despite running 45 min,
          # leaving no way to tell how far it had actually got.
          PYTHONUNBUFFERED: "1"
        run: |
          PAGES_BASE="https://$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f1).github.io/$(echo "${GITHUB_REPOSITORY}" | cut -d/ -f2)"
          python run_cycle.py --site-dir site --pages-base "$PAGES_BASE" \
            ${{ inputs.hours && format('--hours {0}', inputs.hours) || '' }}
      - name: publish (orphan force-push to gh-pages)
        run: |
          if [ ! -f site/manifest.json ]; then echo "nothing built"; exit 0; fi
          cd site
          git init -b gh-pages -q
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com add -A
          git -c user.name=pipeline -c user.email=pipeline@users.noreply.github.com commit -q -m "cycle $(date -u +%Y%m%dT%H%MZ)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
